# src/grub-pxe.cfg — PXE/HTTP boot GRUB config for NP545XLA
#
# All paths use the tsbootkit HTTP server. GRUB was chainloaded by the
# UEFI Shell after the ASIX AX88179 driver loaded, so efinet should
# have a working NIC and these HTTP paths should resolve.
#
# Server: 192.168.202.5:8080 (tsbootkit)
# TFTP/HTTP root: pxe/tftp/
#
# Run sync-pxe.sh to copy kernel/DTB/initrd into the served tree.
# To update kernel/DTB: just replace files in pxe/tftp/ and reboot.
#
# netconsole: no interface name specified — USB NIC appears too late
# for netconsole to bind at init time, so we let it defer and attach
# to whatever interface comes up first.
#
# net.ifnames=0: forces classic eth0/eth1 naming (no predictable-names)
# ip=eth0:dhcp: brings up the NIC via DHCP in the initrd, prints iface info

set timeout=30
set default=0

set server=192.168.202.5:8080
set prefix=(http,${server})/boot/grub

# --- Standard boot ---

menuentry 'NP545XLA (DT, nomodeset + netconsole)' {
    echo ">>> HTTP Boot: DT, nomodeset, netconsole → 192.168.202.5:6666"
    devicetree (http,${server})/boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux (http,${server})/boot/vmlinuz efi=novamap clk_ignore_unused console=tty0 loglevel=8 nomodeset net.ifnames=0 ip=eth0:dhcp netconsole=6666@192.168.202.50/,6666@192.168.202.5/
    initrd (http,${server})/boot/initrd.img
}

menuentry 'NP545XLA (DT, nomodeset + break=top + netconsole)' {
    echo ">>> HTTP Boot: DT, nomodeset, initrd shell, netconsole → 192.168.202.5:6666"
    devicetree (http,${server})/boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux (http,${server})/boot/vmlinuz efi=novamap clk_ignore_unused console=tty0 loglevel=8 nomodeset net.ifnames=0 ip=eth0:dhcp break=top netconsole=6666@192.168.202.50/,6666@192.168.202.5/
    initrd (http,${server})/boot/initrd.img
}

menuentry 'NP545XLA (DT, nomodeset + break=premount + netconsole)' {
    echo ">>> HTTP Boot: DT, nomodeset, initrd shell before mount, netconsole → 192.168.202.5:6666"
    devicetree (http,${server})/boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux (http,${server})/boot/vmlinuz efi=novamap clk_ignore_unused console=tty0 loglevel=8 nomodeset net.ifnames=0 ip=eth0:dhcp break=premount netconsole=6666@192.168.202.50/,6666@192.168.202.5/
    initrd (http,${server})/boot/initrd.img
}

# --- IOMMU diagnostic entries ---

menuentry 'NP545XLA (DT, nomodeset + iommu=off + netconsole)' {
    echo ">>> HTTP Boot: DT, nomodeset, IOMMU disabled, netconsole → 192.168.202.5:6666"
    devicetree (http,${server})/boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux (http,${server})/boot/vmlinuz efi=novamap clk_ignore_unused console=tty0 loglevel=8 nomodeset net.ifnames=0 ip=eth0:dhcp iommu=off netconsole=6666@192.168.202.50/,6666@192.168.202.5/
    initrd (http,${server})/boot/initrd.img
}

menuentry 'NP545XLA (DT, nomodeset + iommu=off + break=top + netconsole)' {
    echo ">>> HTTP Boot: DT, nomodeset, IOMMU off, initrd shell, netconsole → 192.168.202.5:6666"
    devicetree (http,${server})/boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux (http,${server})/boot/vmlinuz efi=novamap clk_ignore_unused console=tty0 loglevel=8 nomodeset net.ifnames=0 ip=eth0:dhcp iommu=off break=top netconsole=6666@192.168.202.50/,6666@192.168.202.5/
    initrd (http,${server})/boot/initrd.img
}

# --- Squashfs over HTTP (full Ubuntu rootfs) ---
# Requires minimal.squashfs in pxe/tftp/boot/
# The casper initrd fetches the squashfs over HTTP and uses it as rootfs.

menuentry 'NP545XLA (DT, squashfs over HTTP + netconsole)' {
    echo ">>> HTTP Boot: DT, nomodeset, squashfs rootfs via HTTP, netconsole → 192.168.202.5:6666"
    devicetree (http,${server})/boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux (http,${server})/boot/vmlinuz efi=novamap clk_ignore_unused console=tty0 loglevel=8 nomodeset net.ifnames=0 ip=eth0:dhcp boot=casper netboot=url url=http://192.168.202.5:8080/boot/minimal.squashfs netconsole=6666@192.168.202.50/,6666@192.168.202.5/
    initrd (http,${server})/boot/initrd.img
}

# --- ACPI fallback (no DT) ---

menuentry 'Ubuntu 26.04 ACPI (netconsole)' {
    echo ">>> HTTP Boot: ACPI (no DT), netconsole → 192.168.202.5:6666"
    linux (http,${server})/boot/vmlinuz efi=novamap console=tty0 loglevel=8 net.ifnames=0 ip=eth0:dhcp netconsole=6666@192.168.202.50/,6666@192.168.202.5/
    initrd (http,${server})/boot/initrd.img
}
