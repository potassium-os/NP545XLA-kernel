# GRUB config for NP545XLA DT boot
#
# The "devicetree" command replaces the firmware-provided DT
# with our custom one — this is how we switch from ACPI to DT boot.
#
# Serial notes:
#   earlycon=qcom_geni,0xA90000 — early console on the GENI UART
#   ttyMSM0 — qcom_geni serial driver (our DT aliases serial0 = uart12)
#   ttyS0 — 8250/amba serial fallback
#   ttyAMA0 — ARM PL011 fallback (DBG2 table declares this subtype)
#   Try all three — which one works depends on what the kernel driver binds to
#
# initrd debug notes:
#   init=/bin/sh is IGNORED — the initrd runs its own /init first
#   Use break= instead: top, modules, premount, bottom
#   nomodeset keeps efifb, prevents DRM from taking over the display

set timeout=30
set default=0

# --- Standard boot entries ---

menuentry 'NP545XLA (DT)' {
    echo ">>> Booting: DT, console=fbcon (tty0 only)"
    devicetree /boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux /boot/vmlinuz efi=novamap clk_ignore_unused console=tty0 loglevel=8
    initrd /boot/initrd.img
}

menuentry 'NP545XLA (DT + serial ttyMSM0)' {
    echo ">>> Booting: DT, console=serial(ttyMSM0)+fbcon, earlycon=qcom_geni"
    devicetree /boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux /boot/vmlinuz efi=novamap clk_ignore_unused earlycon=qcom_geni,0xA90000 console=ttyMSM0,115200n8 console=tty0 loglevel=8
    initrd /boot/initrd.img
}

# --- Initrd debug shell entries ---

menuentry 'NP545XLA DT — break=top, ttyMSM0' {
    echo ">>> Booting: DT, initrd shell before any scripts, serial(ttyMSM0)+fbcon"
    devicetree /boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux /boot/vmlinuz efi=novamap clk_ignore_unused earlycon=qcom_geni,0xA90000 console=ttyMSM0,115200n8 console=tty0 loglevel=8 break=top
    initrd /boot/initrd.img
}

menuentry 'NP545XLA DT — break=premount, ttyMSM0' {
    echo ">>> Booting: DT, initrd shell before mounting root, serial(ttyMSM0)+fbcon"
    devicetree /boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux /boot/vmlinuz efi=novamap clk_ignore_unused earlycon=qcom_geni,0xA90000 console=ttyMSM0,115200n8 console=tty0 loglevel=8 break=premount
    initrd /boot/initrd.img
}

# --- nomodeset entries (keeps efifb, prevents DRM from blanking display) ---

menuentry 'NP545XLA DT — nomodeset, ttyMSM0' {
    echo ">>> Booting: DT, nomodeset (efifb only), serial(ttyMSM0)+fbcon"
    devicetree /boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux /boot/vmlinuz efi=novamap clk_ignore_unused earlycon=qcom_geni,0xA90000 console=ttyMSM0,115200n8 console=tty0 loglevel=8 nomodeset
    initrd /boot/initrd.img
}

menuentry 'NP545XLA DT — nomodeset + break=top, ttyMSM0' {
    echo ">>> Booting: DT, nomodeset, initrd shell (break=top), serial(ttyMSM0)+fbcon"
    devicetree /boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux /boot/vmlinuz efi=novamap clk_ignore_unused earlycon=qcom_geni,0xA90000 console=ttyMSM0,115200n8 console=tty0 loglevel=8 nomodeset break=top
    initrd /boot/initrd.img
}

menuentry 'NP545XLA DT — nomodeset + break=premount, ttyMSM0' {
    echo ">>> Booting: DT, nomodeset, initrd shell (break=premount), serial(ttyMSM0)+fbcon"
    devicetree /boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux /boot/vmlinuz efi=novamap clk_ignore_unused earlycon=qcom_geni,0xA90000 console=ttyMSM0,115200n8 console=tty0 loglevel=8 nomodeset break=premount
    initrd /boot/initrd.img
}

# --- IOMMU diagnostic entries (SMMU is built-in; these are for debugging only) ---

menuentry 'NP545XLA DT — nomodeset + iommu=off, ttyMSM0' {
    echo ">>> Booting: DT, nomodeset, IOMMU disabled, serial(ttyMSM0)+fbcon"
    devicetree /boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux /boot/vmlinuz efi=novamap clk_ignore_unused earlycon=qcom_geni,0xA90000 console=ttyMSM0,115200n8 console=tty0 loglevel=8 nomodeset iommu=off
    initrd /boot/initrd.img
}

menuentry 'NP545XLA DT — nomodeset + iommu=off + break=top, ttyMSM0' {
    echo ">>> Booting: DT, nomodeset, IOMMU disabled, initrd shell (break=top), serial(ttyMSM0)+fbcon"
    devicetree /boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux /boot/vmlinuz efi=novamap clk_ignore_unused earlycon=qcom_geni,0xA90000 console=ttyMSM0,115200n8 console=tty0 loglevel=8 nomodeset iommu=off break=top
    initrd /boot/initrd.img
}

# --- Serial-only entries (no fbcon — all output to serial port) ---

menuentry 'NP545XLA DT — serial only, ttyMSM0' {
    echo ">>> Booting: DT, console=serial ONLY (ttyMSM0), no fbcon"
    devicetree /boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux /boot/vmlinuz efi=novamap clk_ignore_unused earlycon=qcom_geni,0xA90000 console=ttyMSM0,115200n8 loglevel=8
    initrd /boot/initrd.img
}

menuentry 'NP545XLA DT — serial only, ttyS0' {
    echo ">>> Booting: DT, console=serial ONLY (ttyS0), no fbcon"
    devicetree /boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux /boot/vmlinuz efi=novamap clk_ignore_unused earlycon=qcom_geni,0xA90000 console=ttyS0,115200n8 loglevel=8
    initrd /boot/initrd.img
}

menuentry 'NP545XLA DT — serial only, ttyAMA0' {
    echo ">>> Booting: DT, console=serial ONLY (ttyAMA0), no fbcon"
    devicetree /boot/dtb/qcom/sc8180xp-samsung-np545xla.dtb
    linux /boot/vmlinuz efi=novamap clk_ignore_unused earlycon=qcom_geni,0xA90000 console=ttyAMA0,115200n8 loglevel=8
    initrd /boot/initrd.img
}

# --- ACPI fallback ---

menuentry 'Ubuntu 26.04 (ACPI fallback)' {
    echo ">>> Booting: ACPI (no DT), console=fbcon (tty0 only)"
    linux /boot/vmlinuz efi=novamap console=tty0 loglevel=8
    initrd /boot/initrd.img
}
