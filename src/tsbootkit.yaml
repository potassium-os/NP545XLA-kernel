# src/tsbootkit.yaml — PXE server config for NP545XLA
#
# Start with: sudo bash src/pxe-serve.sh en0
#   Or directly: sudo tsbootkit-pxed --config src/tsbootkit.yaml
#
# The "interface" field is auto-set by pxe-serve.sh.
# If running tsbootkit-pxed directly, set it manually.
#
# See: docs/pxe-boot-plan.md for full setup instructions.

interface: en6           # change to match your USB ethernet interface
bootFile: BOOTAA64.EFI
tftpRoot: pxe/tftp
mode: dhcp
httpPort: 8080
logging:
  level: debug
wait: true

dhcp:
  leaseTime: 600       # seconds (60–86400)
  answerAll: true      # respond to non-PXE DHCP requests?

reservations:
  - mac: 9c:69:d3:41:7c:d6
    ip: 192.168.202.50
    bootFile: BOOTAA64.EFI
